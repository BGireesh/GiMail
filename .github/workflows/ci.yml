name: CI

on:
  push:
    branches: [main, build]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  lint:
    name: Format and clippy
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.shard }}/2)
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: taiki-e/install-action@nextest

      - name: Run workspace tests
        run: cargo nextest run --workspace --no-fail-fast --partition hash:${{ matrix.shard }}/2

      - name: Run doc tests
        if: matrix.shard == 1
        run: cargo test --workspace --doc
